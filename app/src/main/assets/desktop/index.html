<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>كفّ · Kaff</title>
<style>
@font-face { font-family: Tajawal; src: url(font/regular) format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: Tajawal; src: url(font/medium) format("truetype"); font-weight: 500; font-display: swap; }
@font-face { font-family: Tajawal; src: url(font/bold) format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: Tajawal; src: url(font/extrabold) format("truetype"); font-weight: 800; font-display: swap; }
:root {
  --bg: #07100C; --deep: #050A08; --glow: #0E3321; --surface: #101B16; --surface2: #16251E;
  --border: rgba(255,255,255,.08); --primary: #2BE38B; --on-primary: #07100C; --soft: #7FF0B8;
  --text: #F2FAF5; --muted: #9DB8AA; --subtle: #CFE3D8; --danger: #FF6B6B;
  --radius: 22px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F6FBF8; --deep: #FFFFFF; --glow: #D5F7E6; --surface: #FFFFFF; --surface2: #EDF6F1;
    --border: rgba(0,0,0,.08); --primary: #1FCB7B; --soft: #0B7A48; --text: #07100C; --muted: #4E6A5C; --subtle: #29453A; --danger: #C62828;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: Tajawal, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(1200px 700px at 50% -10%, var(--glow), var(--bg) 70%) fixed, var(--bg);
  color: var(--text); -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
.logo { width: 46px; height: 46px; border-radius: 14px; background: var(--primary); display: grid; place-items: center; box-shadow: 0 10px 40px -8px var(--primary); }
.logo svg { width: 28px; height: 28px; }
.brand { font-size: 26px; font-weight: 800; letter-spacing: .2px; }
.brand small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  background: color-mix(in srgb, var(--primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); color: var(--soft); }
.pill.neutral { background: color-mix(in srgb, var(--text) 6%, transparent); border-color: color-mix(in srgb, var(--text) 14%, transparent); color: var(--subtle); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
.grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
.card { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; backdrop-filter: blur(12px); }
.card h2 { margin: 0 0 4px; font-size: 21px; font-weight: 700; }
.card .sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
.row { display: flex; align-items: center; gap: 12px; }
.btn { border: 0; border-radius: 16px; padding: 12px 18px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; transition: transform .15s ease, box-shadow .2s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 12px 34px -12px var(--primary); }
.btn.ghost { background: transparent; color: var(--soft); border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.file { position: relative; border-radius: 18px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); text-decoration: none; color: inherit; display: block;
  transition: transform .2s ease, border-color .2s ease; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.file:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
.thumb { aspect-ratio: 1; display: grid; place-items: center; background: linear-gradient(145deg, var(--surface2), var(--glow)); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 40px; height: 40px; color: var(--primary); }
.meta { padding: 10px 12px 12px; }
.name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: start; unicode-bidi: plaintext; }
.size { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.get { position: absolute; top: 10px; inset-inline-end: 10px; width: 34px; height: 34px; border-radius: 12px; background: rgba(5,10,8,.62); display: grid; place-items: center; backdrop-filter: blur(6px); }
.get svg { width: 18px; height: 18px; color: #fff; }
.empty { text-align: center; padding: 34px 10px; color: var(--muted); }
.empty svg { width: 46px; height: 46px; color: var(--primary); opacity: .8; margin-bottom: 8px; }
.drop { border: 1.5px dashed color-mix(in srgb, var(--primary) 45%, transparent); border-radius: 20px; padding: 34px 18px; text-align: center; transition: background .2s, border-color .2s, transform .2s; cursor: pointer; }
.drop.over { background: color-mix(in srgb, var(--primary) 10%, transparent); border-color: var(--primary); transform: scale(1.01); }
.drop svg { width: 46px; height: 46px; color: var(--primary); }
.drop b { display: block; font-size: 18px; margin: 8px 0 4px; }
.drop span { color: var(--muted); font-size: 14px; }
.queue { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.up { background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; animation: rise .35s ease both; }
.up .row { justify-content: space-between; }
.bar { height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--text) 10%, transparent); overflow: hidden; margin-top: 9px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--soft)); border-radius: 99px; transition: width .2s linear; }
.up.done .bar i { width: 100% !important; }
.up.fail .bar i { background: var(--danger); }
.state { font-size: 12.5px; color: var(--muted); }
.up.done .state { color: var(--soft); }
.up.fail .state { color: var(--danger); }
.center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.hero { max-width: 460px; }
.hero h1 { font-size: 30px; margin: 22px 0 8px; font-weight: 800; }
.hero p { color: var(--muted); font-size: 17px; line-height: 1.7; margin: 0; }
.pulse { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; position: relative; background: color-mix(in srgb, var(--primary) 14%, transparent); }
.pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--primary); animation: ring 2.4s ease-out infinite; }
.pulse::after { animation-delay: 1.2s; }
.pulse svg { width: 56px; height: 56px; color: var(--primary); }
.foot { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; display: flex; gap: 8px; justify-content: center; align-items: center; }
.foot svg { width: 15px; height: 15px; color: var(--primary); }
.toast { position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translateX(50%); background: var(--surface2); border: 1px solid var(--border); padding: 12px 18px; border-radius: 14px; box-shadow: 0 20px 40px -20px #000; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
[dir="ltr"] .toast { transform: translateX(-50%); }
.toast.show { opacity: 1; }
.clips { margin-top: 20px; }
.compose { display: flex; gap: 10px; align-items: stretch; }
.compose textarea { flex: 1; resize: vertical; min-height: 54px; max-height: 220px; font: inherit; font-size: 16px; color: var(--text);
  background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; outline: none; unicode-bidi: plaintext; }
.compose textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
.clip-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.clip { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface2); border: 1px solid var(--border); animation: rise .35s ease both; }
.clip.mine { background: color-mix(in srgb, var(--primary) 8%, var(--surface2)); }
.clip .txt { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; unicode-bidi: plaintext; text-align: start; font-size: 15.5px; max-height: 7.5em; overflow: auto; }
.clip a.txt { color: var(--soft); text-decoration: none; }
.clip a.txt:hover { text-decoration: underline; }
.clip .who { font-size: 12px; color: var(--muted); margin-top: 3px; }
.clip svg.src { width: 18px; height: 18px; color: var(--primary); flex: none; }
.icon-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
.icon-btn svg { width: 19px; height: 19px; }
.fast { margin-bottom: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 16%, var(--surface)), var(--surface)); border-color: color-mix(in srgb, var(--primary) 35%, transparent); }
.fast .bolt { width: 46px; height: 46px; border-radius: 14px; background: var(--primary); display: grid; place-items: center; flex: none; }
.fast .bolt svg { width: 24px; height: 24px; color: var(--on-primary); }
.fast .info { flex: 1; min-width: 220px; }
.fast b { font-size: 17px; }
.fast p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.cred { display: inline-flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 6px 6px 6px 14px; margin: 4px; }
[dir="rtl"] .cred { padding: 6px 14px 6px 6px; }
.cred small { color: var(--muted); font-size: 12px; display: block; }
.cred code { font: 600 17px ui-monospace, Consolas, monospace; direction: ltr; unicode-bidi: isolate; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; user-select: none; margin-top: 4px; }
.switch input { accent-color: var(--primary); width: 16px; height: 16px; }
.file.fresh { box-shadow: 0 0 0 2px var(--primary), 0 12px 30px -12px var(--primary); }
.hidden { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes ring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10V6a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.5 14a1.5 1.5 0 0 1 2.5-1.6L8 15"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 10l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>

</svg>

<div class="wrap">
  <header>
    <div class="logo"><svg style="color:var(--on-primary)"><use href="#i-hand"/></svg></div>
    <div class="brand"><span data-t="brand"></span><small data-t="tagline"></small></div>
    <div class="spacer"></div>
    <span class="pill hidden" id="link"><span class="dot"></span><span id="link-text"></span></span>
  </header>

  <section id="v-wait" class="center">
    <div class="hero">
      <div class="pulse"><svg><use href="#i-phone"/></svg></div>
      <h1 data-t="waitTitle"></h1>
      <p data-t="waitBody"></p>
    </div>
  </section>

  <section id="v-denied" class="center hidden">
    <div class="hero">
      <div class="pulse" style="background:color-mix(in srgb,var(--danger) 14%,transparent)"><svg style="color:var(--danger)"><use href="#i-lock"/></svg></div>
      <h1 data-t="deniedTitle"></h1>
      <p data-t="deniedBody"></p>
      <p style="margin-top:22px"><button class="btn primary" id="retry" data-t="retry"></button></p>
    </div>
  </section>

  <section id="v-lost" class="center hidden">
    <div class="hero">
      <div class="pulse" style="background:color-mix(in srgb,var(--text) 8%,transparent)"><svg style="color:var(--muted)"><use href="#i-phone"/></svg></div>
      <h1 data-t="lostTitle"></h1>
      <p data-t="lostBody"></p>
    </div>
  </section>

  <section id="v-main" class="hidden">
    <div class="card fast hidden" id="fast">
      <div class="bolt"><svg><use href="#i-bolt"/></svg></div>
      <div class="info"><b data-t="fastTitle"></b><p data-t="fastBody"></p></div>
      <div>
        <span class="cred"><span><small data-t="network"></small><code id="fast-ssid"></code></span><button class="icon-btn" id="copy-ssid"><svg><use href="#i-copy"/></svg></button></span>
        <span class="cred"><span><small data-t="password"></small><code id="fast-pass"></code></span><button class="icon-btn" id="copy-pass"><svg><use href="#i-copy"/></svg></button></span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div style="flex:1">
            <h2 data-t="fromPhone"></h2>
            <p class="sub" id="from-sub"></p>
            <label class="switch"><input type="checkbox" id="auto"><span data-t="autoDl"></span></label>
          </div>
          <a class="btn primary" id="zip" href="zip" download><svg width="18" height="18"><use href="#i-down"/></svg><span data-t="downloadAll"></span></a>
        </div>
        <div class="files" id="files"></div>
        <div class="empty hidden" id="no-files"><svg><use href="#i-phone"/></svg><div data-t="noFiles"></div></div>
      </div>
      <div class="card">
        <h2 data-t="toPhone"></h2>
        <p class="sub" data-t="toPhoneSub"></p>
        <label class="drop" id="drop">
          <svg><use href="#i-up"/></svg>
          <b data-t="dropTitle"></b>
          <span data-t="dropBody"></span>
          <input type="file" id="pick" multiple hidden>
        </label>
        <div class="queue" id="queue"></div>
      </div>
    </div>
    <div class="card clips">
      <h2 data-t="clipsTitle"></h2>
      <p class="sub" data-t="clipsSub"></p>
      <div class="compose">
        <textarea id="clip-text" rows="2" maxlength="20000"></textarea>
        <button class="btn primary" id="clip-send" data-t="send"></button>
      </div>
      <div class="clip-list" id="clips"></div>
    </div>
    <div class="foot"><svg><use href="#i-lock"/></svg><span data-t="privacy"></span></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const ar = !/^en/i.test(navigator.language || "") || /^ar/i.test(navigator.language || "");
  const T = ar ? {
    brand: "كفّ", tagline: "نقل مباشر من جوالك · بدون إنترنت",

  } : {
    brand: "Kaff", tagline: "Straight from your phone · no internet",
    waitTitle: "Approve on your phone", waitBody: "We asked for permission on the phone's screen. Tap “Allow” to connect this computer.",
    deniedTitle: "Not approved", deniedBody: "The request was declined or timed out. You can try again.", retry: "Try again",
    lostTitle: "Lost the phone", lostBody: "Keep Kaff's desktop screen open and both devices on the same network. Reconnecting…",
    fromPhone: "From the phone", toPhone: "To the phone", toPhoneSub: "Saved to Gallery or Downloads, in a Kaff folder.",

    privacy: "Direct local link between your devices only · no server in between", connected: d => "Connected to " + d,
    count: n => n === 1 ? "1 file" : n + " files",
    cancelled: "Cancelled on the phone", sending: "Sending…", sent: "On the phone ✓", failed: "Failed · check storage", queued: "Queued",
    allSent: n => T.count(n) + " sent to the phone", units: ["B", "KB", "MB", "GB"], speed: "/s",
    fastTitle: "Want it much faster?", fastBody: "Join Kaff's direct network on this computer (no router in between). This page follows you there.",
    network: "Network", password: "Password", autoDl: "Download new files automatically",
    newFiles: n => n === 1 ? "A new file arrived from the phone" : n + " new files from the phone",
    moved: "Switched to a faster network ✓",
    clipsTitle: "Text & links", clipsSub: "Type or paste (Ctrl+V) and press Enter: it lands on the phone right away. What the phone sends shows up here.",
    clipHint: "Text, a link, a number, anything…", send: "Send", copied: "Copied", fromPhone: "From the phone", fromPc: "From this computer", copy: "Copy",
  };
  document.documentElement.lang = ar ? "ar" : "en";
  document.documentElement.dir = ar ? "rtl" : "ltr";
  document.title = ar ? "كفّ · سطح المكتب" : "Kaff · Desktop";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t]; });

  const $ = id => document.getElementById(id);
  const views = ["wait", "denied", "lost", "main"];
  const show = v => views.forEach(n => $("v-" + n).classList.toggle("hidden", n !== v));
  const nf = new Intl.NumberFormat(ar ? "ar" : "en", { maximumFractionDigits: 1 });
  const size = b => { let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return nf.format(b) + " " + T.units[i]; };
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3200); };
  const icon = mime => mime.startsWith("video/") ? "i-video" : mime.startsWith("audio/") ? "i-music" : mime === "application/vnd.android.package-archive" ? "i-app" : "i-file";
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let approved = false, lastFiles = "", started = false, fails = 0;
  let key = (location.hash.match(/k=([0-9a-f]{32})/) || [])[1] || null;
  let alternates = [];
  const moved = /moved=1/.test(location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname);
  const H = () => key ? { "X-Kaff-Key": key } : {};
  const K = () => key ? "?k=" + key : "";
  // On by default: what the phone sends lands in Downloads by itself, like a USB copy.
  let autoDl = true;
  try { autoDl = localStorage.getItem("kaff-auto") !== "0"; } catch (e) { }

  async function hello() {
    show("wait");
    while (!approved) {
      try {
        const r = await fetch("api/hello", { cache: "no-store", headers: H() });
        const j = await r.json();
        if (j.approved) {
          approved = true;
          key = j.key || key;
          alternates = j.alternates || [];
          fast(j.fast);
          connected(j.device);
          if (moved) toast(T.moved);
          return;
        }
        show("denied"); return;
      } catch (e) { show("lost"); await new Promise(r => setTimeout(r, 2500)); }
    }
  }

  function fast(net) {
    $("fast").classList.toggle("hidden", !net);
    if (!net) return;
    $("fast-ssid").textContent = net.ssid;
    $("fast-pass").textContent = net.pass;
  }

  function connected(device) {
    $("link").classList.remove("hidden");
    $("link-text").textContent = T.connected(device);
    show("main");
    refresh();
    pollClips();
    if (started) return;
    started = true;
    setInterval(refresh, 2000);
    setInterval(pollClips, 1500);
  }

  // The computer switched networks (home Wi-Fi <-> Kaff network): find the phone on its other address.
  let searching = false;
  async function findPhone() {
    if (searching || !key) return;
    searching = true;
    try {
      for (const alt of alternates) {
        if (location.href.startsWith(alt)) continue;
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 2500);
        try {
          await fetch(alt + "api/ping", { mode: "no-cors", cache: "no-store", signal: ctl.signal });
          location.href = alt + "#k=" + key + "&moved=1";
          return;
        } catch (e) { } finally { clearTimeout(timer); }
      }
    } finally { searching = false; }
  }

  // Text and links, both ways. navigator.clipboard needs HTTPS, so copying falls back to execCommand.
  let lastClip = 0;
  const isLink = t => /^(https?:\/\/|www\.)\S+$/i.test(t);
  function copyText(text) {
    const done = () => toast(T.copied);
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done);
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } finally { ta.remove(); }
  }
  async function pollClips() {
    if (!approved) return;
    try {
      const r = await fetch("api/clips?since=" + lastClip, { cache: "no-store", headers: H() });
      if (!r.ok) return;
      const j = await r.json();
      for (const clip of j.clips) {
        lastClip = Math.max(lastClip, clip.id);
        addClip(clip);
        if (clip.phone && document.hidden === false) toast(T.fromPhone + ": " + clip.text.slice(0, 60));
      }
    } catch (e) { }
  }
  function addClip(clip) {
    const el = document.createElement("div");
    el.className = "clip" + (clip.phone ? "" : " mine");
    const href = isLink(clip.text) ? (/^www\./i.test(clip.text) ? "https://" + clip.text : clip.text) : null;
    el.innerHTML = `<svg class="src"><use href="#${clip.phone ? "i-phone" : "i-desk"}"/></svg>
      <div style="flex:1;min-width:0">${href ? `<a class="txt" target="_blank" rel="noopener noreferrer"></a>` : `<div class="txt"></div>`}<div class="who">${clip.phone ? T.fromPhone : T.fromPc}</div></div>
      <button class="icon-btn" title="${T.copy}" aria-label="${T.copy}"><svg><use href="#i-copy"/></svg></button>`;
    const txt = el.querySelector(".txt");
    txt.textContent = clip.text;
    if (href) txt.href = href;
    el.querySelector("button").addEventListener("click", () => copyText(clip.text));
    $("clips").prepend(el);
    while ($("clips").children.length > 50) $("clips").lastChild.remove();
  }
  async function sendClip() {
    const box = $("clip-text"), text = box.value.trim();
    if (!text) return;
    $("clip-send").disabled = true;
    try {
      const r = await fetch("api/clip", { method: "POST", body: text, headers: { "Content-Type": "text/plain;charset=utf-8", ...H() } });
      if (r.ok) { box.value = ""; pollClips(); }
    } finally { $("clip-send").disabled = false; box.focus(); }
  }

  async function refresh() {
    try {
      const r = await fetch("api/files", { cache: "no-store", headers: H() });
      if (r.status === 403) { approved = false; return hello(); }
      const j = await r.json();
      fails = 0;
      if (!$("v-lost").classList.contains("hidden")) show("main");
      const sig = JSON.stringify(j.files);
      if (sig === lastFiles) return;
      lastFiles = sig;
      render(j.files);
    } catch (e) {
      if (++fails >= 2) { show("lost"); findPhone(); }
    }
  }

  const seen = new Set();
  let firstRender = true;
  function render(files) {
    // Files the phone added since the last look: highlighted, announced, optionally downloaded.
    const fresh = files.filter(f => !seen.has(f.id));
    files.forEach(f => seen.add(f.id));
    // New since the last look, or sent before this page opened and not on the computer yet.
    const due = fresh.filter(f => !firstRender || !f.delivered);
    if (due.length) {
      toast(T.newFiles(due.length));
      if (autoDl) due.forEach((f, i) => setTimeout(() => download(f), i * 450));
    }
    const freshIds = firstRender ? new Set() : new Set(fresh.map(f => f.id));
    firstRender = false;
    const total = files.reduce((s, f) => s + f.size, 0);
    $("from-sub").textContent = files.length ? T.count(files.length) + " · " + size(total) : "";
    $("zip").classList.toggle("hidden", files.length < 2);
    $("zip").href = "zip" + K();
    $("no-files").classList.toggle("hidden", files.length > 0);
    $("files").innerHTML = files.map((f, i) => {
      const visual = /^(image|video)\//.test(f.mime)
        ? `<img loading="lazy" alt="" src="api/thumb/${f.id}${K()}" onerror="this.outerHTML='<svg><use href=&quot;#${icon(f.mime)}&quot;/></svg>'">`
        : `<svg><use href="#${icon(f.mime)}"/></svg>`;
      return `<a class="file${freshIds.has(f.id) ? " fresh" : ""}" href="file/${f.id}${K()}" download style="animation-delay:${Math.min(i, 12) * 35}ms">
        <div class="thumb">${visual}</div>
        <span class="get"><svg><use href="#i-down"/></svg></span>
        <div class="meta"><div class="name" title="${esc(f.name)}">${esc(f.name)}</div><div class="size">${size(f.size)}</div></div></a>`;
    }).join("");
  }

  function download(f) {
    const a = Object.assign(document.createElement("a"), { href: "file/" + f.id + K(), download: f.name });
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Uploads: two at a time, each with live progress and speed.
  const queue = [];
  let running = 0, sentCount = 0;
  function enqueue(list) {
    for (const file of list) {
      const el = document.createElement("div");
      el.className = "up";
      el.innerHTML = `<div class="row"><div class="name" style="flex:1">${esc(file.name)}</div><div class="state">${T.queued}</div></div><div class="bar"><i></i></div>`;
      $("queue").prepend(el);
      queue.push({ file, el });
    }
    pump();
  }
  function pump() {
    while (running < 2 && queue.length) {
      const job = queue.shift();
      running++;
      upload(job).finally(() => { running--; if (!running && !queue.length && sentCount) { toast(T.allSent(sentCount)); sentCount = 0; } pump(); });
    }
  }
  function upload({ file, el }) {
    return new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      const state = el.querySelector(".state"), bar = el.querySelector(".bar i");
      const start = performance.now();
      xhr.open("PUT", "upload?name=" + encodeURIComponent(file.name) + "&type=" + encodeURIComponent(file.type || ""));
      if (key) xhr.setRequestHeader("X-Kaff-Key", key);
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const secs = (performance.now() - start) / 1000;
        bar.style.width = (e.loaded / e.total * 100).toFixed(1) + "%";
        state.textContent = size(e.loaded) + " / " + size(e.total) + (secs > .5 ? " · " + size(e.loaded / secs) + T.speed : "");
      };
      xhr.onload = () => {
        const ok = xhr.status === 200;
        el.classList.add(ok ? "done" : "fail");
        state.textContent = ok ? T.sent : xhr.status === 409 ? T.cancelled : T.failed;
        if (ok) sentCount++;
        resolve();
      };
      xhr.onerror = () => { el.classList.add("fail"); state.textContent = T.failed; resolve(); };
      state.textContent = T.sending;
      xhr.send(file);
    });
  }

  const drop = $("drop");
  drop.addEventListener("click", e => { if (e.target.id !== "pick") { e.preventDefault(); $("pick").click(); } });
  $("pick").addEventListener("change", e => { enqueue(e.target.files); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || e.target === document.documentElement) drop.classList.remove("over"); }));
  document.addEventListener("drop", e => { if (approved && e.dataTransfer.files.length) enqueue(e.dataTransfer.files); });
  $("retry").addEventListener("click", hello);
  $("auto").checked = autoDl;
  $("auto").addEventListener("change", e => { autoDl = e.target.checked; try { localStorage.setItem("kaff-auto", autoDl ? "1" : "0"); } catch (x) { } });
  $("copy-ssid").addEventListener("click", () => copyText($("fast-ssid").textContent));
  $("copy-pass").addEventListener("click", () => copyText($("fast-pass").textContent));
  $("clip-text").placeholder = T.clipHint;
  $("clip-send").addEventListener("click", sendClip);
  $("clip-text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendClip(); } });
  // Ctrl+V anywhere: pasted files are uploaded, pasted text goes into the box.
  document.addEventListener("paste", e => {
    if (!approved || document.activeElement === $("clip-text")) return;
    const files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { enqueue(files); return; }
    const text = e.clipboardData && e.clipboardData.getData("text");
    if (text) { $("clip-text").value = text; $("clip-text").focus(); }
  });

  hello();
})();
</script>
</body>
</html>
