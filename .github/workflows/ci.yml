name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache hand landmarker model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/hand_landmarker.task
          key: hand-landmarker-float16-v1

      - name: Fetch MediaPipe model
        run: sh scripts/fetch_model.sh

      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --stacktrace

      - name: Release build (R8)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaff-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
