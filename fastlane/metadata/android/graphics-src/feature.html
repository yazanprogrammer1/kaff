<!doctype html><html dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(../../../../app/src/main/res/font/tajawal_extrabold.ttf);font-weight:800}
@font-face{font-family:T;src:url(../../../../app/src/main/res/font/tajawal_medium.ttf);font-weight:500}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(70% 120% at 78% 40%,#0E3321 0%,#07100C 70%);font-family:T;color:#F2FAF5;position:relative}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;left:-60px;top:-10px;background:radial-gradient(circle,#2BE38B33,transparent 65%)}
.hand{position:absolute;left:120px;top:95px;width:310px;height:310px;border-radius:72px;background:linear-gradient(145deg,#5ff2ab,#1fcb7b);display:grid;place-items:center;box-shadow:0 40px 90px -30px #2BE38B}
.hand svg{width:200px;height:200px}
.ring{position:absolute;left:85px;top:60px;width:380px;height:380px;border-radius:96px;border:2px solid #2BE38B55}
.ring.b{left:50px;top:25px;width:450px;height:450px;border-radius:120px;border-color:#2BE38B22}
.t{position:absolute;right:70px;top:120px;width:440px}
h1{font-size:96px;margin:0;line-height:1;font-weight:800}
p{font-size:34px;margin:22px 0 0;font-weight:500;color:#CFE3D8;line-height:1.4}
.pill{display:inline-block;margin-top:26px;padding:10px 22px;border-radius:999px;background:#2BE38B1f;border:1px solid #2BE38B66;color:#7FF0B8;font-size:22px;font-weight:500}
</style><body><div class="glow"></div><div class="ring b"></div><div class="ring"></div>

<div class="t"><h1>كفّ</h1><p>اقبض كفّك هنا…<br>وافتحها هناك.</p><span class="pill">بدون إنترنت · سريع · مشفّر</span></div></body></html>
