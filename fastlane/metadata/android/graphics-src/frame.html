<!doctype html>
<!-- Frames one raw screenshot for Google Play: ?lang=ar&shot=1_home&t=Title&s=Subtitle (1080 × 1920). -->
<html dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(../../../../app/src/main/res/font/tajawal_extrabold.ttf);font-weight:800}
@font-face{font-family:T;src:url(../../../../app/src/main/res/font/tajawal_medium.ttf);font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{font-family:T;color:#F2FAF5;background:radial-gradient(900px 700px at 50% 8%,#14513a 0%,#0b2a1e 40%,#07100C 75%);position:relative}
.cap{position:absolute;top:110px;left:70px;right:70px;text-align:center}
h1{font-size:84px;line-height:1.15;margin:0;font-weight:800}
h1 em{font-style:normal;color:#2BE38B}
p{font-size:40px;margin:22px 0 0;color:#CFE3D8;font-weight:500}
.phone{position:absolute;left:50%;top:470px;transform:translateX(-50%);width:720px;height:1440px;border-radius:84px;padding:22px;
  background:linear-gradient(160deg,#25392f,#0b130f);box-shadow:0 60px 120px -40px #000,0 0 0 2px rgba(255,255,255,.07) inset,0 0 140px -40px #2BE38B66}
.screen{width:100%;height:100%;border-radius:64px;overflow:hidden;background:#07100C;padding-top:76px;box-sizing:border-box}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.notch{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:150px;height:40px;border-radius:22px;background:#030604}
</style><body>
<div class="cap"><h1 id="t"></h1><p id="s"></p></div>
<div class="phone"><div class="screen"><img id="img"></div><div class="notch"></div></div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get("lang") || "ar";
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
document.getElementById("img").src = "../screens-raw/" + lang + "/" + q.get("shot") + ".png";
document.getElementById("t").innerHTML = q.get("t");
document.getElementById("s").textContent = q.get("s");
</script>
</body></html>
